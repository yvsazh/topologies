[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: long-running tests (deselect with -m 'not slow')"]
# New deprecations raised from our own modules fail the suite; third-party ones stay warnings.
filterwarnings = ["error::DeprecationWarning:topologies.*"]
