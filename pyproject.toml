[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "topologies"
dynamic = ["version"]
description = "A continuously updated library of modern neural-network architectures on PyTorch"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Yaroslav Sazhchenko" }]
keywords = ["pytorch", "deep-learning", "neural-networks", "architectures", "transformer"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.2,<2.13",  # upper bound = newest torch the local suite passes on; raise after testing
  "numpy>=1.23",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "httpx>=0.27",  # artifact-store HTTP integration (only via topologies.artifact_store.client)
  "tomli>=2.0; python_version < '3.11'",  # tomllib backport (utils.config, artifact_store)
]
urls = { Homepage = "https://topologies.hackwhiz.net", Documentation = "https://topologies.hackwhiz.net", Repository = "https://github.com/yvsazh/topologies", Issues = "https://github.com/yvsazh/topologies/issues" }

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff==0.16.9", "build", "twine", "matplotlib>=3.7"]
vision = ["torchvision>=0.17", "pillow>=9"]
nlp = ["tokenizers>=0.15", "datasets>=2.14"]
tensorboard = ["tensorboard>=2.12"]
system = ["psutil>=5.9"]
optimization = ["torchao==0.18.0"]
visualization = ["matplotlib>=3.7"]
introspection = ["topologies[visualization]"]  # alias: figures for topologies.introspection
qt = ["PySide6>=6.5"]  # optional GUI reference example only; core visualization stays Qt-free
synth-parquet = ["pyarrow>=12"]  # optional: parquet shards and exports
all = ["topologies[vision,nlp,tensorboard,system,synth-parquet,visualization]"]

[project.scripts]
topologies = "topologies.cli:main"

[tool.hatch.version]
path = "src/topologies/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/topologies"]
include = ["src/topologies/training/model_recipes.json"]
ignore-vcs = true

[tool.hatch.build.targets.sdist]
# Explicit allow-list: package only the library and its public metadata.
include = [
  "/src/topologies",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
]
exclude = ["__pycache__"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["src/topologies/models/[!_]*.py", "src/topologies/layers/[!_]*.py"]

